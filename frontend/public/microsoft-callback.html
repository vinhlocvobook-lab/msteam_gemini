<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Microsoft Authentication - Synapse Collab</title>
  <style>
    body {
      background: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.05);
      border-radius: 50%;
      border-top: 3px solid #8b5cf6;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 {
      font-weight: 500;
      margin: 0 0 8px 0;
      font-size: 18px;
    }
    p {
      color: #a1a1aa;
      font-size: 13px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>Đang kết nối với Synapse</h2>
  <p>Xác thực thành công. Đang hoàn tất đăng nhập của bạn...</p>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const state = urlParams.get('state');
    
    if (code) {
      // Send the code back to the parent window
      window.opener.postMessage({ type: 'MS_AUTH_CODE', code, state }, window.location.origin);
    } else {
      const error = urlParams.get('error') || 'Không thể lấy authorization code từ Microsoft.';
      const errorDescription = urlParams.get('error_description') || '';
      window.opener.postMessage({ type: 'MS_AUTH_ERROR', error, errorDescription }, window.location.origin);
    }
    
    // Auto-close popup
    window.close();
  </script>
</body>
</html>
